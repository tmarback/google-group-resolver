# Build workflow

name: CI

on:
  push:
    branches:
      - main
      - 'support/v*'
    tags:
      - v* # Also version tags

concurrency: 
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      packages: write # For the container
      contents: write # For the dependency graph
      # For attestation
      id-token: write
      attestations: write
    env:
      IMAGE_FULL_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: 'recursive'

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java and Maven
        uses: actions/setup-java@v4
        with: 
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Build
        run: |
            VERSION="${{ github.ref == 'refs/heads/main' && 'edge' || github.ref_name }}"
            ./gradlew build -Pchecker=true -Pstrict=true -Pversion=${VERSION#${{ startsWith(github.ref, 'refs/heads/support/v') && 'support/' || '' }}v}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_FULL_NAME }}
          tags: |
            type=edge,branch=main
            # branch name, except main, which gets the edge label
            type=ref,event=branch,enable=${{ github.ref != format('refs/heads/{0}', 'main') }}
            # full version
            type=semver,pattern={{version}}
            # minor version
            type=semver,pattern={{major}}.{{minor}}
            # major version
            #type=semver,pattern={{major}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: 'v2.4.1'

      - name: Sign image
        run: cosign sign --yes ${{ env.IMAGE_FULL_NAME }}@${{ steps.image.outputs.digest }}

      - name: Generate image attestation
        if: ${{ ! github.event.repository.private }}
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE_FULL_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: false

      - name: Generate SBOM
        if: ${{ ! github.event.repository.private }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_FULL_NAME }}@${{ steps.image.outputs.digest }}
          artifact-name: sbom.spdx.json
          output-file: ./sbom.spdx.json
          upload-artifact: true
        env:
          SYFT_SELECT_CATALOGERS: +sbom-cataloger # Catalog nested SBOMs

      - name: Generate SBOM attestation
        if: ${{ ! github.event.repository.private }}
        uses: actions/attest-sbom@v1
        with:
          subject-name: ${{ env.IMAGE_FULL_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ./sbom.spdx.json
          push-to-registry: false 
